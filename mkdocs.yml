site_name: "gsxform: Wavelet scattering transforms on graphs"
site_url: https://armaank.github.io/gsxform

docs_dir: docs/

# fail the build on broken nav entries or dead internal links
strict: true

theme:
  name: material
  icon:
    logo: fontawesome/solid/book
    repo: fontawesome/brands/git-alt
  features:
    #- navigation.instant
    #- navigation.tabs
    #- toc.integrate
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
  language: en

nav:
  - Home: index.md
  - Development: development.md
  - Examples:
    - Overview: examples.md
    - Understanding graph wavelets and scattering transforms: examples/wavelets.md
    - QM9 embeddings with PCA: examples/qm9_pca.md
    - Cuneiform classification with an SVM: examples/cuneiform_svm.md
    - Generating molecules: examples/qm9_generation.md
  - API Reference:
    - Graph utilities: graph.md
    - Wavelet utilities:
        - Kernel functions: kernel.md
        - Graph wavelet transforms: wavelets.md
    - Graph scattering transforms: scattering.md
    - torch_geometric adapters: pyg.md
  - Changelog: changelog.md
  - About gsxform: about.md

extra:
  version:
    provider: mike

extra_css:
    - css/custom.css
# see https://mkdocstrings.github.io/python/usage/#supported-docstrings-styles
# for options
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          inventories:
          - https://docs.python.org/3/objects.inv
          - https://mkdocstrings.github.io/objects.inv
          - https://mkdocstrings.github.io/griffe/objects.inv
          options:
            docstring_style: numpy
            docstring_options:
              ignore_init_summary: yes
            merge_init_into_class: yes
            separate_signature: yes
            show_source: yes
            show_root_full_path: no
            show_root_heading: yes

# runs the marimo example notebooks and renders them as pages
hooks:
  - hooks/marimo_examples.py

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.superfences
    #- mkautodoc
  - toc:
      permalink: true

repo_name: armaank/gsxform
repo_url: https://github.com/armaank/gsxform
