name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync environment
        run: uv sync --locked --all-groups
      - name: Lint
        run: make lint
      - name: Type check
        run: make typecheck

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Apple Silicon: same resolution as linux
          - os: macos-latest
            python-version: "3.12"
          # Intel mac: torch has no wheels past 2.2.2, which pins numpy to 1.x.
          # 3.12 is the newest interpreter that resolution supports.
          - os: macos-15-intel
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Sync environment
        run: uv sync --locked --all-groups
      - name: Show resolved versions
        run: uv run python -c "import torch, numpy; print(torch.__version__, numpy.__version__)"
      - name: Run tests
        run: make tests
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          name: codecov-umbrella
          fail_ci_if_error: false
